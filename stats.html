<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통계 · 불규칙 수입 대학생을 위한 지출 관리 서비스</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <div class="phone">

    <header class="pagebar">
      <h1 class="pagebar-title">통계</h1>
      <p class="pagebar-sub">이대로 쓰면 언제 잔액이 0원이 되는지 보여 줍니다</p>
    </header>

    <main>

      <!-- ============ 0원 예상일 요약 ============ -->
      <section class="today">
        <p class="today-label">이대로 쓰면 잔액이 0원이 되는 날</p>
        <p class="today-amount today-amount--sm" id="zero-date">―</p>
        <p class="today-hint" id="zero-hint">기록이 모이면 예측이 나옵니다</p>
        <p class="today-formula" id="zero-formula"></p>
      </section>

      <!-- ============ 잔액 예측 꺾은선 그래프 ============ -->
      <section class="block">
        <h2 class="block-title">
          잔액 예측
          <span class="block-count" id="chart-range">―</span>
        </h2>
        <!-- 그래프는 stats.js 가 SVG 로 그려 넣습니다 -->
        <div class="chart-wrap" id="line-chart"></div>
        <ul class="legend">
          <li><span class="legend-dot legend-dot--line"></span>예상 잔액</li>
          <li id="legend-zero" hidden><span class="legend-dot legend-dot--zero"></span>0원이 되는 날</li>
          <li id="legend-income" hidden><span class="legend-dot legend-dot--income"></span>다음 입금일</li>
        </ul>
      </section>

      <!-- ============ 카테고리별 지출 구성 ============ -->
      <section class="block">
        <h2 class="block-title">
          이번 달 지출 구성
          <span class="block-count" id="month-total">―</span>
        </h2>
        <ul class="category-list" id="compose-list"></ul>
      </section>

      <!-- ============ 최근 7일 지출 ============ -->
      <section class="block">
        <h2 class="block-title">
          최근 7일 지출
          <span class="block-count" id="week-avg">―</span>
        </h2>
        <div class="chart-wrap" id="week-chart"></div>
      </section>

    </main>

    <nav class="tabbar">
      <a class="tab" href="index.html">메인</a>
      <a class="tab" href="expense.html">지출 입력</a>
      <span class="tab tab--active">통계</span>
    </nav>

  </div>

  <!-- storage.js 를 먼저 읽어야 계산 함수를 쓸 수 있습니다 -->
  <script src="storage.js?v=7"></script>
  <script src="stats.js?v=7"></script>
</body>
</html>
