# ===================================================================
# Supabase 자동 깨우기
#
# 무료 플랜은 일주일 넘게 요청이 없으면 프로젝트를 자동으로 멈춘다.
# 실제로 1차 제출 뒤 16일 동안 아무도 들어가지 않아 멈춰 있었고,
# 사이트는 열리는데 로그인과 저장이 되지 않는 상태가 됐다.
#
# 그래서 GitHub Actions 가 하루에 한 번 데이터베이스에 요청을 보내
# '사용 중'인 상태로 유지한다. 돈은 들지 않는다.
#
# 아래 키는 supabase.js 에도 그대로 들어 있는 공개용 anon 키다.
# RLS 가 켜져 있어 이 키만으로는 남의 데이터를 읽을 수 없다.
# ===================================================================

name: Supabase 깨우기

on:
  schedule:
    # 매일 15:00 UTC = 한국 시간 자정
    - cron: '0 15 * * *'
  workflow_dispatch:        # 버튼으로 직접 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 데이터베이스에 요청 보내기
        run: |
          URL="https://xemhdplaeibojryughtc.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlbWhkcGxhZWlib2pyeXVnaHRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MTE3OTIsImV4cCI6MjEwOTA4Nzc5Mn0.yGV3LdaF62tNTwlHxpXTsijpDWQXno0eyj-N53dM3oQ"

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$URL/rest/v1/expenses?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")

          echo "응답 코드: $code"

          if [ "$code" = "200" ]; then
            echo "데이터베이스가 살아 있습니다."
          elif [ "$code" = "521" ]; then
            echo "::error::521 - 프로젝트가 멈춰 있습니다. Supabase 대시보드에서 Restore 가 필요합니다."
            exit 1
          else
            echo "::error::예상치 못한 응답 코드 $code"
            exit 1
          fi
