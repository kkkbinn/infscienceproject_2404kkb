<!DOCTYPE html>
<!-- lang="ko": 이 문서가 한국어라고 브라우저에 알려 줍니다 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- viewport: 휴대폰에서 화면 너비에 맞춰 표시되게 합니다 (5차시 배포 후 폰 접속용) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>불규칙 수입 대학생을 위한 지출 관리 서비스</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>

  <div class="phone">

    <div class="user-bar" id="user-bar"></div>

    <!-- ============ 상단 : 현재 잔액과 다음 입금일까지 남은 일수 ============ -->
    <header class="topbar">
      <div class="topbar-item">
        <span class="topbar-label">현재 잔액</span>
        <!-- id를 붙인 곳이 app.js가 숫자를 채워 넣는 자리입니다 -->
        <strong class="topbar-value" id="balance">―</strong>
      </div>
      <div class="topbar-item topbar-item--right">
        <span class="topbar-label">다음 입금까지</span>
        <strong class="topbar-value" id="dday">―</strong>
        <span class="topbar-sub" id="next-income">―</span>
      </div>
    </header>

    <main>

      <!-- ============ 중앙 : 오늘의 안전 지출 금액 (가장 크게) ============ -->
      <section class="today">
        <p class="today-label" id="today-label">오늘 쓸 수 있는 금액</p>
        <p class="today-amount" id="safe-amount">―</p>
        <p class="today-hint" id="today-hint">여기까지는 써도 괜찮아요</p>
        <!-- 오늘 이미 쓴 돈. 이게 있어야 '어제 쓴 만큼 오늘이 줄어든다'가 보입니다 -->
        <p class="today-spent" id="today-spent"></p>
        <!-- 계산 과정을 한 줄로 보여 줍니다. 손 검산과 비교하기 위해서 (4차시) -->
        <p class="today-formula" id="today-formula"></p>
      </section>

      <!-- ============ 계산에 쓰는 값 입력 (4차시) ============ -->
      <!-- 여기 값을 바꾸면 위의 '오늘 쓸 수 있는 금액'이 바로 다시 계산됩니다 -->
      <section class="block">
        <h2 class="block-title">내 돈 정보</h2>

        <div class="field">
          <label class="field-label" for="input-balance">현재 잔액 (통장 + 현금)</label>
          <input class="field-input" type="number" id="input-balance" min="0" placeholder="312000">
        </div>

        <div class="field">
          <label class="field-label" for="input-income-date">다음 입금 예정일</label>
          <input class="field-input" type="date" id="input-income-date">
        </div>

        <div class="field field-row">
          <div class="field-col">
            <label class="field-label" for="input-income-type">무슨 돈인가요</label>
            <select class="field-input" id="input-income-type">
              <option value="알바비">알바비</option>
              <option value="용돈">용돈</option>
              <option value="과외비">과외비</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div class="field-col">
            <label class="field-label" for="input-income-amount">들어올 금액</label>
            <input class="field-input" type="number" id="input-income-amount" min="0" placeholder="478000">
          </div>
        </div>

        <!-- 합계는 아래 고정지출 목록에서 자동으로 계산됩니다 -->
        <input type="hidden" id="input-fixed" value="0">

        <p class="balance-note" id="balance-note"></p>
      </section>

      <!-- ============ 고정지출 (항목별) ============ -->
      <section class="block">
        <h2 class="block-title">
          고정지출
          <span class="block-count" id="fixed-total">0건</span>
        </h2>

        <ul class="record-list" id="fixed-list"></ul>

        <form id="fixed-form" class="fixed-form">
          <input class="field-input fixed-name" type="text" id="fixed-name"
                 placeholder="통신비" maxlength="20">
          <input class="field-input fixed-amount" type="number" id="fixed-amount"
                 placeholder="55000" min="1">
          <input class="field-input fixed-day" type="number" id="fixed-day"
                 placeholder="25일" min="1" max="31">
          <button class="fixed-add" type="submit">추가</button>
        </form>
        <p class="note">통신비·구독료·교통 정기권처럼 매달 빠져나가는 돈입니다. 합계가 '오늘의 기준' 계산에서 먼저 빠집니다.</p>
      </section>

      <!-- ============ 중단 : 카테고리별 남은 예산 막대 ============ -->
      <section class="block">
        <h2 class="block-title">카테고리별 남은 예산 <span class="block-count" id="category-summary"></span></h2>
        <!-- 비어 있는 이유 : app.js가 카테고리 6개를 반복해서 만들어 넣습니다 -->
        <ul class="category-list" id="category-list"></ul>
      </section>

      <!-- ============ 하단 : 원터치 빠른 입력 버튼 ============ -->
      <section class="block">
        <h2 class="block-title">빠른 입력</h2>
        <div class="quick-list" id="quick-list"></div>
        <p class="note">버튼 한 번이면 이 화면에서 바로 기록되고, 위의 금액이 즉시 줄어듭니다.</p>
      </section>

    </main>

    <!-- ============ 화면 이동 탭 (화면 3개) ============ -->
    <nav class="tabbar">
      <span class="tab tab--active">메인</span>
      <a class="tab" href="expense.html">지출 입력</a>
      <a class="tab" href="stats.html">통계</a>
    </nav>

    <!-- 기록했을 때 짧게 떴다 사라지는 알림 -->
    <div class="toast" id="toast" hidden></div>

  </div>

  <!-- script를 body 끝에 두는 이유 : 위 HTML이 다 만들어진 뒤에 실행되어야
       app.js가 id로 자리를 찾을 수 있기 때문입니다 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase.js?v=15"></script>
  <script src="storage.js?v=15"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
